name: Industrial Safety Technologies
description: 'Industrial Safety Technologies (IST) was a hardware-focused industrial safety platform,
  founded in 2011 and built by Battery Ventures through acquisitions of gas-detection and hazard-monitoring
  businesses including Gas Measurement Instruments (GMI), Detcon, DSA Detection, and Simtronics. Its products
  centered on fixed and portable gas detectors, flame detectors, and hazardous-environment safety
  instrumentation for industrial sites. IST was acquired by Scott Safety, a Tyco business, from Battery
  Ventures for $329.5 million in December 2014 and no longer exists as an independent company; the enrichment
  pipeline found no public API, developer portal, OpenAPI, or documentation surface to profile.'
